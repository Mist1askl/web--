<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="王语晗的个人主页 - 数据科学与大数据技术专业学生">
<title>王语晗的个人主页</title>
<style>
  /* ===== 基础 ===== */
  * { box-sizing: border-box; }
  html {
    /* 锚点跳转时目标不被导航栏盖住 */
    scroll-padding-top: 64px;
  }
  body {
    margin: 0;
    padding-top: 64px;        /* 给固定导航栏留出高度 */
    font-family: "Microsoft YaHei", sans-serif;
    font-size: 17px;
    line-height: 1.7;
    color: #34506b;
    background: #eef3f9;
  }
  /* ===== 固定导航栏 ===== */
  .nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    background: #ffffff;
    border-bottom: 1px solid #dde6ef;
  }
  .nav a {
    color: #4ba0e0;
    text-decoration: none;
    padding: 4px 2px;
    border-bottom: 2px solid transparent;
  }
  .nav a:hover {
    border-bottom-color: #6ab1e4;
  }
  /* ===== 内容卡片 ===== */
  main {
    max-width: 1000px;
    margin: 32px auto;
    padding: 36px;
    background: #ffffff;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(36, 54, 75, .06);
  }
  h1 {
    margin: 0 0 10px;
    font-size: 30px;
    color: #075d9c;
  }
  h2 {
    margin: 32px 0 14px;
    font-size: 22px;
    color: #d6489e;
  }
  main > h2:first-of-type { margin-top: 0; }
  h3 {
    margin: 0 0 8px;
    font-size: 19px;
    color: #9a64e0;
  }
  p { margin: 0 0 12px; }
  a { color: #4ba0e0; }
  /* ===== 个人简介 ===== */
  .profile {
    display: flex;
    align-items: center;
    gap: 26px;
    margin-top: 26px;
    padding: 26px;
    background: #f4f8fc;
    border-radius: 12px;
  }
  .avatar {
    flex-shrink: 0;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg, #cfe6fb, #a4d0f2);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* ===== 作品/卡片列表 ===== */
  .works {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
  }
  .work {
    flex: 1 1 240px;
    display: flex;
    flex-direction: column;
    padding: 20px;
    background: #fbfcfe;
    border: 1px solid #dde6ef;
    border-radius: 12px;
  }
  .work ul { margin: 0; padding-left: 22px; }
  .work li { margin: 4px 0; }
  /* ===== 分隔区块 ===== */
  .contact {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid #e4ecf4;
  }
  footer {
    margin-top: 28px;
    text-align: center;
    color: #7b8ea3;
    font-size: 15px;
  }
</style>
</head>
<body>
  <nav class="nav">
    <a href="#home">首页</a>
    <a href="#about">关于我</a>
    <a href="#works">我的作品</a>
    <a href="#contact">联系我</a>
  </nav>
  <main>
    <header id="home">
      <h1>王语晗的个人主页</h1>
    </header>

    <section class="profile" id="about">
      <div class="avatar"><img src="./avater.jpg" alt="我的照片"></div>
      <div>
        <h2>你好啊，我是王语晗</h2>
        <p>我是数据科学与大数据技术专业的学生</p>
      </div>
    </section>

    <h2 id="works">我的作品</h2>
    <div class="works">
      <article class="work">
        <h3>兴趣爱好</h3>
        <ul>
          <li>人工智能</li>
          <li>数据分析</li>
          <li>阅读</li>
          <li>追剧</li>
        </ul>
      </article>
      <article class="work">
        <h3>学习方向</h3>
        <ul>
          <li>学习 Web 程序设计</li>
          <li>学习人工智能</li>
          <li>学习数据分析</li>
          <li>学习 Python 程序设计</li>
          <li>学好英语</li>
        </ul>
      </article>
    </div>

    <section class="contact" id="contact">
      <h2>联系我</h2>
      <p>邮箱：<a href="mailto:3996855016@qq.com">3996855016@qq.com</a></p>
      <p>GitHub：<a href="https://github.com/Mist1askl" target="_blank" rel="noopener">github.com/Mist1askl</a></p>
    </section>

    <footer>王语晗的个人主页 · 用心制作</footer>
  </main>
</body>
</html>
